version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    # The API and solution require the unpublished shared ServiceDefaults package.
    # CI validates them from pinned source; Dependabot scans the remaining manifests.
    exclude-paths:
      - Legacy.Maliev.FileService.slnx
      - Legacy.Maliev.FileService.Api/**
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: Legacy.Maliev.ServiceDefaults
      - dependency-name: Legacy.Maliev.CompatibilityContracts
    groups:
      nuget-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /Legacy.Maliev.FileService.Api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-dependencies:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
