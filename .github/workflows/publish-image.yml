name: Publish immutable image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-gate:
    if: vars.LEGACY_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record planned-only state
        run: echo "Deployment remains gated until migration, parity, rollback, capacity, secrets, WIF, GitOps and staging gates pass."

  publish:
    permissions:
      contents: read
      actions: read
      id-token: write
    if: vars.LEGACY_DEPLOY_ENABLED == 'true'
    uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/.github/workflows/publish-image.yml@503e8846390a597c267d2889b33a9c26863389b3
    with:
      image: ${{ vars.LEGACY_ARTIFACT_REGISTRY }}/legacy-maliev-file-service
      dockerfile: Legacy.Maliev.FileService.Api/Dockerfile
      context: .
      environment: legacy-production
      workload-identity-provider: ${{ vars.LEGACY_WORKLOAD_IDENTITY_PROVIDER }}
      service-account: ${{ vars.LEGACY_FILE_PUBLISHER_SERVICE_ACCOUNT }}
      legacy-service-defaults-ref: 8f4f5f27b226ffe406c4c79b1903742e8c2e7dd3
      compatibility-contracts-ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
