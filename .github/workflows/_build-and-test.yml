name: Build and test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
      VSTestCollect: XPlat Code Coverage
      VSTestLogger: trx
      VSTestResultsDirectory: ${{ github.workspace }}/runner-results
    steps:
      - name: Check out FileService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 7edcd961024868513fd5f373cab3dcb261197f77
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out approved offline image-plan producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.Workflows
          ref: 0159e67a033712a7120d52173819e8bde214cf6e
          path: .dependencies/Legacy.Maliev.Workflows
          persist-credentials: false
      - name: Check out immutable strict File consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.Intranet
          ref: 3f5f7542c93cb085757130971c4fc7cf61043f01
          path: .dependencies/Legacy.Maliev.Intranet
          persist-credentials: false
      - name: Verify exact consumer source before compilation
        run: |
          git -C .dependencies/Legacy.Maliev.Intranet show 3f5f7542c93cb085757130971c4fc7cf61043f01:Legacy.Maliev.Intranet/PurchaseOrders/LegacyFileClient.cs | sha256sum | awk '$1 != "98a4b2954e9dede6c3d237af1ae9b42198dec7f61835af22a61e601ded731bea" { exit 1 }'
          echo 'a4a31a998cc168709d0914fa19b4836f5da219c73a3d6f99c7a2e40d15429758  .dependencies/Legacy.Maliev.Intranet/Legacy.Maliev.Intranet/PurchaseOrders/LegacyFileClient.cs' | sha256sum --check --strict
      - name: Select the hosted SDK for owned startup children
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - name: Supply the exact job SDK host to startup fixtures
        shell: bash
        run: |
          host=$(command -v dotnet)
          test -x "$host"
          echo "DOTNET_HOST_PATH=$host" >> "$GITHUB_ENV"
      - name: Validate .NET solution
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e3a6093324a24968876782153286f52db8b29fd8
        with:
          solution: Legacy.Maliev.FileService.slnx
          use-local-maliev-dependencies: 'true'
      - name: Require all eight standalone startup boundary regressions
        shell: bash
        env:
          GITHUB_ACTIONS: 'false'
        run: |
          set -euo pipefail
          test "$(command -v dotnet)" = "$DOTNET_HOST_PATH"
          timeout 600 dotnet test Legacy.Maliev.FileService.Tests/Legacy.Maliev.FileService.Tests.csproj --configuration Release --no-build --no-restore --filter FullyQualifiedName~FileStartupBoundaryTests --logger 'trx;LogFileName=startup.trx' --results-directory startup-results
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse('startup-results/startup.trx')
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          results = tree.findall('./t:Results/t:UnitTestResult', ns)
          from collections import Counter
          prefix = 'Legacy.Maliev.FileService.Tests.Startup.FileStartupBoundaryTests.'
          expected = {
              prefix + 'ActualApiEntryPoint_FailsOnceWithPrivateMetadataAndNoPlaintextFallback': 2,
              prefix + 'EmbeddedNormalProgram_PreservesOriginalInitializationFailureAndCallerExitCode': 1,
              prefix + 'StreamingReader_EnforcesBoundWithoutTruncatingAssertions': 2,
              prefix + 'PartialStartUncertainty_RetainsExactHandleDirectoryAndOriginalFailure': 1,
              prefix + 'UnsettledReaders_PreventDisposalAndRemovalUntilBothActuallyFinish': 1,
              prefix + 'DirectoryCleanupFailure_PreservesPrimaryAndEveryCleanupFailureForRecovery': 1,
          }
          definitions = tree.findall('./t:TestDefinitions/t:UnitTest', ns)
          by_id = {}
          for definition in definitions:
              identity = definition.get('id')
              method = definition.find('t:TestMethod', ns)
              if not identity or identity in by_id or method is None:
                  raise SystemExit('Missing or duplicated startup definition identity')
              class_name = method.get('className', '').split(',', 1)[0].strip()
              method_name = method.get('name', '').split('(', 1)[0]
              by_id[identity] = class_name + '.' + method_name
          ids = [row.get('testId') for row in results]
          names = [row.get('testName', '') for row in results]
          actual = Counter(by_id.get(identity, '') for identity in ids)
          if (actual != expected or len(by_id) != 8 or set(ids) != set(by_id)
                  or len(set(ids)) != 8 or len(set(names)) != 8
                  or any(row.get('outcome') != 'Passed' for row in results)):
              raise SystemExit('Expected all eight distinct passing startup boundary definitions and results')
          PY
      - name: Prove legacy machine-local upload date causally
        timeout-minutes: 25
        run: |-
          python3 -B -m unittest discover -s scripts -p test_prove_local_date.py
          python3 -B scripts/prove_local_date.py runner-results
      - name: Gate owned production coverage
        run: python3 scripts/verify-runner-coverage.py runner-results
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: file-validation-${{ github.sha }}
          path: |
            runner-results/
            startup-results/
          if-no-files-found: warn
          retention-days: 7
