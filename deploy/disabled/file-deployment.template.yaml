# Dormant: no active GitOps inclusion. Render requires an approved immutable image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-maliev-file
  namespace: maliev-legacy
  labels:
    app.kubernetes.io/name: legacy-maliev-file-service
    app.kubernetes.io/part-of: maliev-legacy
  annotations:
    legacy.maliev.com/deployment-enabled: "false"
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: legacy-maliev-file-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-maliev-file-service
        app.kubernetes.io/part-of: maliev-legacy
    spec:
      serviceAccountName: legacy-maliev-file
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 1654
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: legacy-maliev-file-service
          image: __REQUIRED_LEGACY_FILE_IMMUTABLE_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: legacy-maliev-file-runtime
                optional: false
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
            - name: FileStorage__Enabled
              value: "false"
            - name: FileStorage__WritesEnabled
              value: "false"
            - name: InstantQuoteFiles__Enabled
              value: "false"
            - name: InstantQuoteFiles__WritesEnabled
              value: "false"
            - name: InstantQuoteFiles__CleanupEnabled
              value: "false"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1654
            runAsGroup: 1654
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /file/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /file/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /file/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 128Mi
      terminationGracePeriodSeconds: 30
